<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mahir Kurutemizleme</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧺%3C/text%3E%3C/svg%3E">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f5f8;--card:#fff;--tx:#17212f;--mut:#6b7686;--bd:#e2e6ec;--nav:#0f1f3a;--ac:#0f9d8a;--or:#f08a1c;--rd:#d93a3a;--in:#eef1f5}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0c1320;--card:#152036;--tx:#e8edf5;--mut:#93a0b4;--bd:#25324b;--nav:#08101e;--in:#1b2944}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0c1320;--card:#152036;--tx:#e8edf5;--mut:#93a0b4;--bd:#25324b;--nav:#08101e;--in:#1b2944}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#side{position:fixed;inset:0 auto 0 0;width:220px;background:var(--nav);color:#cdd6e6;padding:14px 8px;overflow:auto;z-index:20;transition:transform .2s;padding-top:calc(14px + env(safe-area-inset-top,0px))}
#side h1{font-size:16px;color:#fff;margin:0 8px 14px}#side h1 small{display:block;font-weight:400;color:#7f8fa8;font-size:11px}
#side a{display:block;padding:9px 12px;border-radius:8px;color:inherit;text-decoration:none;margin-bottom:2px}
#side a.on,#side a:hover{background:#1c3158;color:#fff}
#main{margin-left:220px;min-height:100vh;display:flex;flex-direction:column}
.col #side{transform:translateX(-100%)}.col #main{margin-left:0}
@media(max-width:800px){#side{transform:translateX(-100%)}#main{margin-left:0}.op #side{transform:none}}
#top{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--bd);display:flex;gap:8px;align-items:center;padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
#sr{position:relative;flex:1;max-width:420px}#sr input{width:100%}
#res{position:absolute;top:100%;left:0;right:0;background:var(--card);border:1px solid var(--bd);border-radius:8px;max-height:60vh;overflow:auto;box-shadow:0 8px 24px #0003;display:none}
#res h4{margin:0;padding:6px 10px;background:var(--in);font-size:11px;color:var(--mut)}#res a{display:block;padding:7px 10px;color:inherit;text-decoration:none;cursor:pointer}#res a:hover{background:var(--in)}
#c{padding:16px;flex:1}
input,select,textarea{font:inherit;color:var(--tx);background:var(--in);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;min-width:0}
button,.b{font:inherit;border:0;border-radius:8px;padding:8px 13px;cursor:pointer;background:var(--ac);color:#fff;text-decoration:none;display:inline-block}
.b2{background:var(--in);color:var(--tx);border:1px solid var(--bd)}.bo{background:var(--or)}.br{background:var(--rd)}.sm{padding:4px 8px;font-size:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:15px}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));margin-bottom:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.st{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;border-left:4px solid var(--ac)}.st small{color:var(--mut)}.st b{display:block;font-size:20px}
.st.o{border-left-color:var(--or)}.st.r{border-left-color:var(--rd)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mut);font-size:12px;cursor:pointer}
.tg{padding:2px 8px;border-radius:99px;font-size:12px;background:var(--in);display:inline-block}.ok{background:#0f9d8a33;color:var(--ac)}.wo{background:#f08a1c33;color:var(--or)}.dg{background:#d93a3a33;color:var(--rd)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.fl{flex:1}
label{display:block;font-size:12px;color:var(--mut);margin:6px 0 2px}.f{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}.f input,.f select,.f textarea{width:100%}
#mo{position:fixed;inset:0;background:#0008;z-index:50;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 10px}
#mo>div{background:var(--card);border-radius:14px;padding:16px;width:100%;max-width:620px}
#tt{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px}#tt div{background:#0f9d8a;color:#fff;padding:9px 16px;border-radius:8px}#tt .e{background:var(--rd)}
.bar{display:flex;align-items:center;gap:6px;margin:4px 0;font-size:12px}.bar i{display:block;height:14px;background:var(--ac);border-radius:4px;min-width:2px}.bar span:first-child{width:90px;overflow:hidden;text-overflow:ellipsis}
.col7{display:flex;align-items:flex-end;gap:8px;height:130px}.col7 div{flex:1;text-align:center;font-size:10px;color:var(--mut);display:flex;flex-direction:column;justify-content:flex-end;height:100%}.col7 i{display:block;background:var(--ac);border-radius:4px 4px 0 0}
.pg{display:flex;gap:2px;margin:6px 0}.pg i{flex:1;height:6px;background:var(--bd);border-radius:3px}.pg i.d{background:var(--ac)}
footer{text-align:center;color:var(--mut);font-size:12px;padding:12px}
#pr{display:none}
@media print{body>*:not(#pr){display:none!important}#pr{display:block;color:#000;background:#fff;font:13px system-ui}#pr.th{width:80mm;font-size:11px}}
body.locked>*:not(#lg){display:none!important}body:not(.locked) #lg{display:none}#lg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:100;padding:16px}</style></head><body class="locked"><div id="lg"></div>
<aside id="side"></aside>
<div id="main"><header id="top"><button class="b2" onclick="tg()">☰</button><div id="sr"><input id="q" placeholder="Ara: müşteri, telefon, sipariş no, ürün…" oninput="gs(this.value)"><div id="res"></div></div><span class="fl"></span><button class="b2" onclick="nots()">🔔 <span id="nb" class="tg dg">0</span></button><button class="b2" onclick="bk()">⬇ Yedek</button><button class="b2" onclick="th()">◐</button><span class="tg">👤 Yönetici</span></header>
<main id="c"></main><footer>Mahir Kurutemizleme · Made by Ömer</footer></div>
<div id="mo"></div><div id="tt"></div><div id="pr"></div>
<script>
const K='mahir_v1',ST=['Sipariş Alındı','İşlem Bekliyor','Yıkama / Temizlik İşleminde','Ütüleme İşleminde','Hazır','Teslim Edildi','İptal Edildi'],PM=['Nakit','Kredi Kartı','Banka Kartı','Havale / EFT','Diğer'],EC=['Kira','Elektrik','Su','Personel','Malzeme','Bakım','Diğer'];
const p2=n=>String(n).padStart(2,'0'),iso=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()),today=()=>iso(new Date()),add=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return iso(d)};
const fd=s=>s?s.slice(8,10)+'.'+s.slice(5,7)+'.'+s.slice(0,4)+(s.length>10?' '+s.slice(11,16):''):'-',tl=n=>(Math.round(n*100)/100).toLocaleString('tr-TR',{minimumFractionDigits:0,maximumFractionDigits:2})+' ₺';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>Math.random().toString(36).slice(2,9);
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
function demo(){let r=7;const R=n=>(r=(r*9301+49297)%233280)/233280*n|0;
const nm=[['Ahmet','Yılmaz'],['Ayşe','Demir'],['Mehmet','Kaya'],['Fatma','Çelik'],['Mustafa','Şahin'],['Zeynep','Arslan'],['Ali','Koç'],['Elif','Aydın'],['Hasan','Öztürk'],['Emine','Yıldız'],['Burak','Polat'],['Selin','Güneş']];
const sv=[['Gömlek','Üst giyim',100,2],['Tişört','Üst giyim',70,2],['Pantolon','Alt giyim',150,2],['Kot pantolon','Alt giyim',140,2],['Takım elbise','Takım',400,3],['Ceket','Üst giyim',250,3],['Mont','Dış giyim',350,4],['Kaban','Dış giyim',400,4],['Kazak','Üst giyim',120,2],['Elbise','Elbise',250,3],['Abiye','Elbise',500,4],['Gelinlik','Elbise',1500,7],['Etek','Alt giyim',120,2],['Şal','Aksesuar',80,2],['Perde','Ev tekstili',200,5],['Battaniye','Ev tekstili',300,4],['Yorgan','Ev tekstili',450,5],['Nevresim','Ev tekstili',250,3],['Havlu','Ev tekstili',60,2],['Ayakkabı','Aksesuar',200,3],['Halı','Ev tekstili',300,6],['Diğer','Diğer',100,3]].map((s,i)=>({id:'S'+(i+1),name:s[0],cat:s[1],price:s[2],days:s[3],desc:'',active:true}));
const customers=nm.map((n,i)=>({id:'M'+(1001+i),first:n[0],last:n[1],phone:'05'+(30+R(20))+' '+(100+R(899))+' '+p2(R(99))+' '+p2(R(99)),phone2:'',notes:'',addr:'',tags:'',active:true,created:add(today(),-60-R(30))}));
const orders=[],payments=[];
for(let i=0;i<22;i++){const c=customers[R(12)],d=add(today(),-(22-i)),it=[];for(let k=0;k<1+R(3);k++){const s=sv[R(21)];it.push({sid:s.id,name:s.name,qty:1+R(3),price:s.price})}
const tot=it.reduce((a,x)=>a+x.qty*x.price,0),old=i<12,stt=old?5:[0,1,2,3,4,4][R(6)];
const o={id:'O'+i,no:1001+i,cid:c.id,date:d,est:add(d,3),deliv:stt==5?d+'T17:00':'',status:ST[stt],items:it,notes:'',emp:'Ömer'};orders.push(o);c.created=c.created<d?c.created:d;
const k=i%3,amt=k==0?tot:k==1?Math.round(tot/2):0;if(amt)payments.push({id:'P'+i,cid:c.id,oid:o.id,amt,method:PM[i%4],date:d,note:'',emp:'Ömer'})}
const expenses=[['Kira',6000],['Elektrik',900],['Su',350],['Malzeme',1200],['Personel',4000]].map((e,i)=>({id:'E'+i,desc:e[0]+' gideri',amt:e[1],cat:e[0],date:add(today(),-i*2),method:'Nakit',notes:''}));
return{demo:true,customers,services:sv,orders,payments,expenses,open:{},cfg:{name:'Mahir Kurutemizleme',phone:'0212 000 00 00',addr:'İstanbul',hours:'09:00 - 19:00',foot:'Bizi tercih ettiğiniz için teşekkür ederiz.',days:3,thermal:false},next:1030}}
if(!S)S=demo();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const cu=id=>S.customers.find(c=>c.id==id)||{first:'Silinmiş',last:'müşteri',phone:''},or=id=>S.orders.find(o=>o.id==id),cn=c=>c.first+' '+c.last;
const paid=o=>S.payments.filter(p=>p.oid==o.id).reduce((a,p)=>a+p.amt,0),tot=o=>o.items.reduce((a,x)=>a+x.qty*x.price,0),can=o=>o.status=='İptal Edildi',rem=o=>can(o)?0:Math.max(0,tot(o)-paid(o));
const ps=o=>paid(o)<=0?'Ödenmedi':rem(o)>0?'Kısmi Ödeme':'Ödendi',pc=o=>({'Ödenmedi':'dg','Kısmi Ödeme':'wo','Ödendi':'ok'}[ps(o)]);
const late=o=>!['Teslim Edildi','İptal Edildi'].includes(o.status)&&o.est<today();
const sum=a=>a.reduce((x,y)=>x+y,0),cOrd=id=>S.orders.filter(o=>o.cid==id&&!can(o)),cDebt=id=>sum(cOrd(id).map(rem));
const stc=o=>({'Hazır':'wo','Teslim Edildi':'ok','İptal Edildi':'dg'}[o.status]||'');
function toast(m,e){const t=document.createElement('div');t.textContent=m;if(e)t.className='e';$('#tt').append(t);setTimeout(()=>t.remove(),2800)}
const $=s=>document.querySelector(s);
function modal(h){$('#mo').innerHTML='<div>'+h+'</div>';$('#mo').style.display='flex'}function cm(){$('#mo').style.display='none'}
$('#mo').onclick=e=>{if(e.target.id=='mo')cm()};
function conf(m,fn){window._cf=fn;modal('<p>'+m+'</p><div class="row"><button class="br" onclick="cm();_cf()">Evet</button><button class="b2" onclick="cm()">Vazgeç</button></div>')}
const wa=c=>'https://wa.me/'+(c.phone.replace(/\D/g,'').replace(/^0/,'90')),tel=c=>'tel:'+c.phone.replace(/\s/g,'');
const NAV=[['ana','Ana Sayfa'],['musteriler','Müşteriler'],['yeni','Yeni Sipariş'],['siparisler','Siparişler'],['hazir','Teslime Hazır'],['teslimat','Teslimat'],['odemeler','Ödemeler'],['borc','Borç Takibi'],['kasa','Kasa ve Finans'],['hizmetler','Hizmetler ve Fiyatlar'],['raporlar','Raporlar'],['ayarlar','Ayarlar']];
function tg(){document.body.parentElement.classList.toggle('col');document.body.classList.toggle('op');document.documentElement.classList.toggle('col')}
function th(){const r=document.documentElement,d=r.dataset.theme=='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark'}
function tbl(id,cols,rows){const st=S.open['s'+id]||{};let a=rows.slice();if(st.c!=null){a.sort((x,y)=>{const u=x[st.c],v=y[st.c];return(u>v?1:u<v?-1:0)*st.d})}
return '<div class="tw"><table><tr>'+cols.map((c,i)=>'<th onclick="srt(\''+id+'\','+i+')">'+c+'</th>').join('')+'</tr>'+(a.length?a.map(r=>'<tr>'+r.cells.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join(''):'<tr><td colspan="'+cols.length+'" style="text-align:center;color:var(--mut);padding:24px">Kayıt bulunamadı.</td></tr>')+'</table></div>'}
let SORT={};function srt(id,i){const s=SORT[id]||{};SORT[id]={c:i,d:s.c==i?-s.d:1};go()}
function T(id,cols,rows){const s=SORT[id];let a=rows.slice();if(s)a.sort((x,y)=>{const u=x.k?x.k[s.c]:0,v=y.k?y.k[s.c]:0;return(u>v?1:u<v?-1:0)*s.d});
return '<div class="tw"><table><tr>'+cols.map((c,i)=>'<th onclick="srt(\''+id+'\','+i+')">'+c+'</th>').join('')+'</tr>'+(a.length?a.map(r=>'<tr>'+r.c.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join(''):'<tr><td colspan="'+cols.length+'" style="text-align:center;color:var(--mut);padding:24px">Kayıt bulunamadı.</td></tr>')+'</table></div>'}
const bars=(d,col)=>{const m=Math.max(1,...d.map(x=>x[1]));return d.length?d.map(x=>'<div class="bar"><span>'+esc(x[0])+'</span><i style="width:'+x[1]/m*60+'%;'+(col?'background:'+col:'')+'"></i><span>'+(x[2]??x[1])+'</span></div>').join(''):'<small>Veri yok.</small>'};
const col7=d=>{const m=Math.max(1,...d.map(x=>x[1]));return '<div class="col7">'+d.map(x=>'<div><small>'+Math.round(x[1])+'</small><i style="height:'+x[1]/m*80+'%"></i>'+x[0]+'</div>').join('')+'</div>'};
const stat=(l,v,c)=>'<div class="st '+(c||'')+'"><small>'+l+'</small><b>'+v+'</b></div>';
const prog=o=>{const i=ST.indexOf(o.status);return can(o)?'':'<div class="pg">'+ST.slice(0,6).map((s,k)=>'<i class="'+(k<=i?'d':'')+'" title="'+s+'"></i>').join('')+'</div>'};
function ordRow(o,x){const c=cu(o.cid),i=ST.indexOf(o.status);return{k:[o.no,cn(c),o.date,o.est,tot(o),paid(o),rem(o),i],c:['<a href="#sip-'+o.id+'">#'+o.no+'</a>','<a href="#mus-'+o.cid+'">'+esc(cn(c))+'</a>',fd(o.date),fd(o.est)+(late(o)?' <span class="tg dg">Gecikti</span>':''),tl(tot(o)),tl(paid(o)),tl(rem(o)),'<span class="tg '+stc(o)+'">'+o.status+'</span>'+prog(o),(x||'')+'<button class="sm" onclick="nxt(\''+o.id+'\')">İleri ▸</button> <button class="sm b2" onclick="ost(\''+o.id+'\')">Durum</button>']}}
const OC=['No','Müşteri','Tarih','Teslim tarihi','Toplam','Ödenen','Kalan','Durum',''];
function nxt(id){const o=or(id),i=ST.indexOf(o.status);if(i>=4)return i==4?dlv(id):0;o.status=ST[i+1];save();toast('Durum: '+o.status);go()}
function ost(id){const o=or(id);modal('<h3>Sipariş #'+o.no+' durumu</h3>'+ST.map(s=>'<button class="b2" style="display:block;width:100%;margin:4px 0;text-align:left" onclick="setst(\''+id+'\',\''+s+'\')">'+s+(s==o.status?' ✓':'')+'</button>').join(''))}
function setst(id,s){cm();if(s=='Teslim Edildi')return dlv(id);if(s=='İptal Edildi')return conf('Sipariş iptal edilsin mi? Ödemeler kayıtlarda kalır.',()=>{or(id).status=s;save();go()});or(id).status=s;or(id).deliv='';save();toast('Durum güncellendi');go()}
function dlv(id){const o=or(id),r=rem(o);modal('<h3>Teslimat — #'+o.no+'</h3><p>'+esc(cn(cu(o.cid)))+'</p>'+o.items.map(x=>x.qty+' × '+esc(x.name)).join('<br>')+'<p>Toplam: <b>'+tl(tot(o))+'</b> · Ödenen: <b>'+tl(paid(o))+'</b> · Kalan: <b style="color:var(--rd)">'+tl(r)+'</b></p>'+(r>0?'<div class="f"><div><label>Şimdi tahsil edilecek (₺)</label><input id="da" type="number" min="0" max="'+r+'" value="'+r+'"></div><div><label>Yöntem</label><select id="dm">'+PM.map(m=>'<option>'+m+'</option>').join('')+'</select></div></div>':'')+'<p>Müşteriye ait ürünlerin teslim edildiğini onaylıyor musunuz?</p><div class="row"><button id="dok" onclick="dok(\''+id+'\')">Teslim Et</button><button class="b2" onclick="cm()">Vazgeç</button></div>')}
function dok(id){const o=or(id),a=$('#da')?+$('#da').value||0:0;if(a<0||a>rem(o))return toast('Geçersiz tutar',1);
const fin=()=>{o.status='Teslim Edildi';o.deliv=new Date().toISOString().slice(0,16);save();cm();toast('Ürünler teslim edildi');go()};
if(a>0)S.payments.push({id:uid(),cid:o.cid,oid:o.id,amt:a,method:$('#dm').value,date:today(),note:'Teslimatta',emp:'Ömer'});
if(rem(o)>0)return conf('Kalan '+tl(rem(o))+' borç olarak kaydedilecek. Devam?',fin);fin()}
function payM(oid,cid){const os=oid?[or(oid)]:cOrd(cid).filter(o=>rem(o)>0);if(!os.length)return toast('Açık borç yok');
modal('<h3>Ödeme Al</h3><div class="f"><div><label>Sipariş</label><select id="po" onchange="$(\'#pa\').value=rem(or(this.value))">'+os.map(o=>'<option value="'+o.id+'">#'+o.no+' — kalan '+tl(rem(o))+'</option>').join('')+'</select></div><div><label>Tutar (₺)</label><input id="pa" type="number" min="0" value="'+rem(os[0])+'"></div><div><label>Yöntem</label><select id="pm">'+PM.map(m=>'<option>'+m+'</option>').join('')+'</select></div><div><label>Not</label><input id="pn"></div></div><div class="row" style="margin-top:10px"><button id="pok" onclick="pok()">Kaydet</button><button class="b2" onclick="cm()">Vazgeç</button></div>')}
function pok(){const o=or($('#po').value),a=+$('#pa').value;if(!(a>0)||a>rem(o)+.001)return toast('Tutar 0 ile kalan borç ('+tl(rem(o))+') arasında olmalı',1);$('#pok').disabled=true;
